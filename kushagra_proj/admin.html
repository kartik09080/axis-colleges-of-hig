<!DOCTYPE html>
<!-- ==========================================================================
     STAFF ADMIN PANEL - admin.html
     Lets college staff manage notices, courses, events, gallery, FAQs,
     settings, online applications and enquiries without touching code.
     ========================================================================== -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Admin Panel | Axis Colleges of Higher Education</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%230b1d3a%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2736%27 font-family=%27Arial%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

  <!-- ===== 1. LOGIN SCREEN ===== -->
  <section id="loginScreen" class="login-wrap">
    <div class="login-box">
      <div class="brand">
        <span class="brand-crest">A</span>
        <span class="brand-text"><strong>Staff Admin Login</strong><small>Axis Colleges Website Manager</small></span>
      </div>
      <form id="loginForm" style="margin-top:1.6rem">
        <div class="form-group">
          <label for="loginPassword">Admin Password <span class="required-star">*</span></label>
          <input class="form-control" type="password" id="loginPassword" required autocomplete="current-password">
        </div>
        <div id="loginError" class="alert-box alert-error" hidden></div>
        <button class="btn btn-primary btn-block" type="submit">Login to Admin Panel</button>
      </form>
      <p class="admin-note" style="margin-top:1rem">Password is set in <code>data/site-data.js</code> (settings.adminPassword). This is a simple lock for a college project, not bank-level security.</p>
      <p style="margin-top:1rem"><a href="index.html">← Back to website</a></p>
    </div>
  </section>

  <!-- ===== 2. ADMIN WORKSPACE (shown after login) ===== -->
  <div id="adminApp" class="admin-layout" hidden>

    <!-- Left sidebar with navigation buttons -->
    <aside class="admin-sidebar">
      <div class="brand" style="margin-bottom:1rem">
        <span class="brand-crest">A</span>
        <span class="brand-text"><strong>Admin Panel</strong><small>Axis Colleges</small></span>
      </div>
      <button class="admin-nav-btn active" data-view="dashboard">📊 Dashboard</button>
      <button class="admin-nav-btn" data-view="notices">📢 Notices</button>
      <button class="admin-nav-btn" data-view="courses">🎓 Courses &amp; Fees</button>
      <button class="admin-nav-btn" data-view="events">🎉 Campus Events</button>
      <button class="admin-nav-btn" data-view="gallery">🖼 Campus Gallery</button>
      <button class="admin-nav-btn" data-view="testimonials">💬 Testimonials</button>
      <button class="admin-nav-btn" data-view="faqs">❓ FAQs</button>
      <button class="admin-nav-btn" data-view="applications">📝 Applications</button>
      <button class="admin-nav-btn" data-view="enquiries">✉️ Enquiries</button>
      <button class="admin-nav-btn" data-view="passes">🎟 Event Passes</button>
      <button class="admin-nav-btn" data-view="settings">⚙️ Website Settings</button>
      <button class="admin-nav-btn" data-view="publish">🚀 Backup &amp; Publish</button>
      <div class="sidebar-foot">
        <a href="index.html" target="_blank" rel="noopener" style="color:#cbd5e1">View website ↗</a><br><br>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </aside>

    <!-- Main area: the selected page is drawn here by admin.js -->
    <main class="admin-main">
      <div id="adminNotice"></div>
      <div id="adminContent"></div>
    </main>
  </div>

  <!-- ===== 3. ADD / EDIT POPUP (generic, filled by admin.js) ===== -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="editTitle">Edit item</h3>
        <button class="modal-close" type="button" data-close="editModal" aria-label="Close">×</button>
      </div>
      <form id="editForm" data-collection="" data-index="-1">
        <div class="admin-form-inline" id="editFields"></div>
        <div class="admin-actions" style="margin-top:1.2rem">
          <button class="btn btn-primary" type="submit">Save</button>
          <button class="btn btn-ghost" type="button" data-close="editModal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Data first, then shared logic, then admin logic -->
  <script src="data/site-data.js"></script>
  <script src="script.js"></script>
  <script src="admin.js"></script>
</body>
</html>
